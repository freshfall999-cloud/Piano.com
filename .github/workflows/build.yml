name: Build

on:
  push:
  workflow_dispatch:
    inputs:
      screenshots:
        description: Run the app in the simulator and save screenshots
        type: boolean
        default: false

jobs:
  polyfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - run: node tests/polyfill.test.js

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build for the iOS Simulator
        run: |
          xcodebuild -version
          xcodebuild build \
            -project PianoBrowser.xcodeproj \
            -target PianoBrowser \
            -configuration Debug \
            -sdk iphonesimulator \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO
      - name: Check bundled web files
        run: |
          app=build/Debug-iphonesimulator/PianoBrowser.app
          ls "$app"
          test -f "$app/WebMIDIPolyfill.js"
          test -f "$app/start.html"
          plutil -p "$app/Info.plist"
      - name: Screenshots in the simulator
        if: github.event_name == 'workflow_dispatch' && inputs.screenshots
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print([x['udid'] for k in sorted(d) if 'iOS' in k for x in d[k] if x['name'].startswith('iPhone')][-1])")
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" build/Debug-iphonesimulator/PianoBrowser.app
          mkdir shots
          shot() {
            name=$1; shift
            xcrun simctl terminate "$udid" com.example.PianoBrowser || true
            xcrun simctl launch "$udid" com.example.PianoBrowser "$@"
            sleep 12
            xcrun simctl io "$udid" screenshot "shots/$name.png"
          }
          shot 1-start
          shot 2-page -uiTestURL https://en.wikipedia.org/wiki/Piano
          shot 3-blocked -uiTestURL http://nudity.testcategory.com
          shot 4-keyboard -uiTestURL "file://$(xcrun simctl get_app_container "$udid" com.example.PianoBrowser)/start.html"
          shot 5-tabs -uiTestScreen tabs
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.screenshots
        with:
          name: screenshots
          path: shots
